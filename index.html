<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>সংগঠন ও তহবিল ব্যবস্থাপনা সিস্টেম</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #0f766e;
      --primary-hover: #115e59;
      --primary-soft: #ccfbf1;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --warn: #d97706;
      --warn-soft: #fef3c7;
      --info: #2563eb;
      --info-soft: #dbeafe;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Hind Siliguri', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 18px 16px 56px;
    }

    /* Top Header */
    .topbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .org-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-wrap {
      position: relative;
      width: 54px;
      height: 54px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .logo-cam-btn {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .org-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    .org-sub {
      font-size: 13px;
      color: var(--muted);
    }

    .topbar-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .role-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface-alt);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .sync-pill.live {
      background: var(--success-soft);
      color: var(--success);
      border-color: #bbf7d0;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-outline {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-outline:hover {
      background: var(--surface-alt);
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-warn {
      background: var(--warn);
      color: #fff;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    /* Nav Tabs */
    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .nav-tab {
      padding: 9px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Cards & Grids */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    .stat-val {
      font-size: 24px;
      font-weight: 700;
      margin-top: 4px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.65fr 1fr;
      gap: 16px;
    }

    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Alert & Banner */
    .due-banner {
      background: var(--danger-soft);
      border: 1px solid #fca5a5;
      color: #991b1b;
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
    }

    .member-reminder-banner {
      background: var(--warn-soft);
      border: 1px solid #fcd34d;
      color: #92400e;
      border-radius: var(--radius);
      padding: 13px 16px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
    }

    .notif-banner {
      background: var(--info-soft);
      border: 1px solid #93c5fd;
      color: #1e3a8a;
      border-radius: var(--radius);
      padding: 13px 16px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      padding: 10px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: var(--surface-alt);
      font-weight: 700;
      color: var(--text);
    }

    /* Avatars & Badges */
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      flex-shrink: 0;
    }

    .member-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge-paid {
      background: var(--success-soft);
      color: var(--success);
    }

    .badge-due {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .badge-pending {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .badge-active {
      background: var(--success-soft);
      color: var(--success);
    }

    .badge-issue {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid #fca5a5;
    }

    /* Portal Cards */
    .portal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .portal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .pin-chip {
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--surface-alt);
      border: 1px dashed var(--border);
      font-size: 13px;
      font-weight: 600;
    }

    .link-box {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .link-input {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      background: var(--surface-alt);
      color: var(--text);
    }

    /* Messages */
    .msg-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 380px;
      overflow-y: auto;
    }

    .msg-item {
      border: 1px solid var(--border);
      background: var(--surface-alt);
      border-radius: 10px;
      padding: 12px;
    }

    .msg-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .msg-sender {
      font-weight: 700;
      color: var(--primary);
    }

    /* Position / Role Directory Grid */
    .dir-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .dir-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      background: var(--surface);
    }

    .dir-photo {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary-soft);
      margin: 0 auto 10px;
      display: block;
    }

    /* Forms & Modals */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: var(--surface);
      color: var(--text);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal-card {
      background: var(--surface);
      border-radius: var(--radius);
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 20px 35px rgba(15, 23, 42, 0.2);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--text);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      z-index: 2000;
      display: none;
    }

    .toast.show {
      display: block;
    }

    @media print {
      body {
        background: #fff !important;
      }
      .no-print {
        display: none !important;
      }
      .print-only-sheet {
        display: block !important;
      }
      @page {
        size: A4 portrait;
        margin: 12mm;
      }
    }

    .print-only-sheet {
      display: none;
    }

    .dev-footer {
      text-align: center;
      padding: 18px 12px 24px;
      margin-top: 24px;
      font-size: 14px;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    .dev-footer a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .dev-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

      function ensureMonthlyCollectionCycle(targetState) {
        const currentMonth = getCurrentMonthKey();
        if (targetState.activeBillingMonth !== currentMonth) {
          targetState.activeBillingMonth = currentMonth;
          targetState.members.forEach((m) => {
            m.paidThisMonth = false;
            m.fineWaived = false;
            m.fineWaiverRequested = false;
            m.fineWaiverReason = "";
          });
          return true;
        }
        return false;
      }

      function isAutoFineActive() {
        const graceEnd = Number(state.graceEndDay || 12);
        const todayDay = new Date().getDate();
        return todayDay > graceEnd;
      }

      function getMemberFine(member) {
        if (!member || member.paidThisMonth || member.fineWaived) return 0;
        return isAutoFineActive() ? Number(state.fineAmount || 100) : 0;
      }

      function normalizeState(parsed) {
        const base = structuredClone(defaultState);
        if (!parsed || typeof parsed !== "object") return base;
        const merged = Object.assign(base, parsed);
        merged.graceEndDay = Number(parsed.graceEndDay || 12);
        merged.fineAmount = Number(parsed.fineAmount || 100);
        merged.monthlyFee = Number(parsed.monthlyFee || 500);
        merged.activeBillingMonth = parsed.activeBillingMonth || getCurrentMonthKey();
        merged.pins = Object.assign({}, base.pins, parsed.pins || {});
        merged.members = (Array.isArray(parsed.members) ? parsed.members : Object.values(parsed.members || {})).map((m, idx) =>
          Object.assign(
            {
              username: slugifyUsername(m.name, m.id || idx + 1),
              password: generateMemberPassword(m.id || idx + 1),
              fineWaived: false,
              fineWaiverRequested: false,
              fineWaiverReason: "",
              issueStatus: "",
              issueNote: "",
              issueUpdatedAt: ""
            },
            m
          )
        );
        merged.transactions = Array.isArray(parsed.transactions) ? parsed.transactions : Object.values(parsed.transactions || {});
        merged.bankDeposits = Array.isArray(parsed.bankDeposits) ? parsed.bankDeposits : Object.values(parsed.bankDeposits || {});
        merged.messages = Array.isArray(parsed.messages) ? parsed.messages : Object.values(parsed.messages || {});
        ensureMonthlyCollectionCycle(merged);
        return merged;
      }

      let state = loadLocalState();
      let unlockedRoles = { president: false, cashier: false };
      let loggedInMemberId = null;
      let activeTab = "overview";

      function loadLocalState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            const fresh = structuredClone(defaultState);
            ensureMonthlyCollectionCycle(fresh);
            return fresh;
          }
          return normalizeState(JSON.parse(raw));
        } catch (err) {
          return structuredClone(defaultState);
        }
      }

      function writeLocalCache(data) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (err) {}
      }

      function saveState() {
        writeLocalCache(state);
        if (!isApplyingRemote && dbRef) {
          dbRef.set(state).catch(() => {
            showToast("Firebase-এ সেভ করতে সমস্যা হয়েছে; লোকাল ব্যাকআপ রাখা হয়েছে");
          });
        }
      }

      function getMemberSeenTimestamp() {
        try {
          return Number(localStorage.getItem(MEMBER_SEEN_NOTIF_KEY) || 0);
        } catch (err) {
          return 0;
        }
      }

      function markMemberNotificationsSeen() {
        try {
          const latestTs = Number((state.latestMessageNotice && state.latestMessageNotice.updatedAt) || Date.now());
          localStorage.setItem(MEMBER_SEEN_NOTIF_KEY, String(latestTs));
        } catch (err) {}
      }

      function hasUnreadMemberNotification() {
        const notice = state.latestMessageNotice;
        if (!notice || !notice.updatedAt) return false;
        return Number(notice.updatedAt) > getMemberSeenTimestamp();
      }

      function updateSyncBadge() {
        const el = document.getElementById("syncStatusBadge");
        if (!el) return;
        if (isFirebaseLive) {
          el.className = "sync-pill live";
          el.textContent = "● Firebase লাইভ";
        } else {
          el.className = "sync-pill";
          el.textContent = "○ লোকাল মোড";
        }
      }

      function initFirebaseRealtime() {
        try {
          if (typeof firebase === "undefined" || !firebaseConfig.databaseURL) return;
          if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
          }

          dbRef = firebase.database().ref(DB_PATH);
          dbRef.on(
            "value",
            (snapshot) => {
              isFirebaseLive = true;
              updateSyncBadge();
              const remoteData = snapshot.val();

              if (remoteData) {
                isApplyingRemote = true;
                const prevTs = Number((state.latestMessageNotice && state.latestMessageNotice.updatedAt) || 0);
                state = normalizeState(remoteData);
                const newTs = Number((state.latestMessageNotice && state.latestMessageNotice.updatedAt) || 0);
                writeLocalCache(state);
                isApplyingRemote = false;

                if (getRoute() === "member" && newTs > prevTs && newTs > getMemberSeenTimestamp()) {
                  showToast("নতুন নোটিফিকেশন: সভাপতি বা ক্যাশিয়ার মেসেজ আপডেট দিয়েছেন!");
                }
                render();
              } else {
                dbRef.set(state).catch(() => {});
              }
            },
            () => {
              isFirebaseLive = false;
              updateSyncBadge();
            }
          );
        } catch (err) {
          isFirebaseLive = false;
          updateSyncBadge();
        }
      }

      function showToast(msg) {
        const el = document.getElementById("toastBox");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => el.classList.remove("show"), 2800);
      }

      function getRoute() {
        const h = (window.location.hash || "").replace(/^#/, "").toLowerCase();
        if (h === "president" || h === "cashier" || h === "member" || h === "main") {
          return h;
        }
        return "main";
      }

        currentLockedRole = route;

      function getRoleLink(role) {

      function copyToClipboard(text, label) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            () => showToast((label || "লিংক") + " কপি হয়েছে"),
            () => fallbackCopy(text, label)
          );
        } else {
          fallbackCopy(text, label);
        }
      }

      function fallbackCopy(text, label) {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast((label || "লিংক") + " কপি হয়েছে");
      }

      function formatTk(num) {
        const n = Number(num || 0);
        return "৳" + n.toLocaleString("bn-BD");
      }

      function computeTotals() {
        let activeIncome = 0;
        let activeExpense = 0;
        let pendingCount = 0;

        state.transactions.forEach((t) => {
          if (t.status === "active") {
            if (t.type === "income") activeIncome += Number(t.amount || 0);
            if (t.type === "expense") activeExpense += Number(t.amount || 0);
          } else {
            pendingCount += 1;
          }
        });

        const netFund = activeIncome - activeExpense;
        const totalBank = state.bankDeposits.reduce((sum, b) => sum + Number(b.amount || 0), 0);
        const dueMembers = state.members.filter((m) => !m.paidThisMonth);
        const totalFines = dueMembers.reduce((sum, m) => sum + getMemberFine(m), 0);
        const waiverPendingCount = state.members.filter((m) => m.fineWaiverRequested).length;
        const issueMembers = state.members.filter((m) => m.issueStatus && m.issueStatus.trim() !== "");

        return {
          activeIncome,
          activeExpense,
          netFund,
          totalBank,
          pendingCount,
          dueMembers,
          totalFines,
          waiverPendingCount,
          issueMembers,
          autoFineOn: isAutoFineActive()
        };
      }

                  ক্যাশিয়ার আয়-ব্যয় যোগ বা এডিট করলে তা প্রথমে <strong>অসম্পূর্ণ</strong> থাকে; সভাপতি অনুমোদন দিলে <strong>সচল</strong> হয় এবং মূল হিসাবে যুক্ত হয়।
                </p>
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>খাত ও বিবরণ</th>
                        <th>ধরন</th>
                        <th>পরিমাণ</th>
                        <th>অবস্থা</th>
                        <th>অ্যাকশন</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${state.transactions
                        .map((t) => {
                          const isActive = t.status === "active";
                          const stBadge = isActive
                            ? `<span class="badge badge-active">সচল</span>`
                            : `<span class="badge badge-pending">অসম্পূর্ণ</span>`;
                          const typeLabel =
                            t.type === "income"
                              ? `<span style="color:var(--success);font-weight:700;">আয়</span>`
                              : `<span style="color:var(--danger);font-weight:700;">ব্যয়</span>`;

                          let act = "";
                          if (role === "cashier") {
                            act = `<button type="button" class="btn btn-outline btn-sm" data-edit-tx="${t.id}">এডিট</button>`;
                          } else if (role === "president" || role === "main") {
                            act = `<div style="display:flex;gap:4px;">
                              ${
                                !isActive
                                  ? `<button type="button" class="btn btn-success btn-sm" data-approve-tx="${t.id}">ওকে / সচল</button>`
                                  : ""
                              }
                              <button type="button" class="btn btn-danger btn-sm" data-del-tx="${t.id}">মুছুন</button>
                            </div>`;
                          } else {
                            act = `<span style="font-size:12px;color:var(--muted);">-</span>`;
                          }

                          return `
                            <tr>
                              <td>
                                <div style="font-weight:700;">${t.source}</div>
                                <div style="font-size:12px;color:var(--muted);">${t.date} • ${t.note || ""}</div>
                              </td>
                              <td>${typeLabel}</td>
                              <td><strong>${formatTk(t.amount)}</strong></td>
                              <td>${stBadge}</td>
                              <td>${act}</td>
                            </tr>
                          `;
                        })
                        .join("")}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <div>
              <div class="card" style="border-color:#fca5a5;">
                <div class="card-header">
                  <div class="card-title" style="color:var(--danger);">বকেয়া, জরিমানা ও সমস্যা বক্স</div>
                </div>
                ${
                  totals.issueMembers.length > 0
                    ? `<div style="margin-bottom:10px;padding:10px;border-radius:10px;background:#fef2f2;border:1px solid #fecaca;">
                        <div style="font-size:13px;font-weight:700;color:var(--danger);margin-bottom:6px;">সদস্যদের সমস্যার আপডেট (${totals.issueMembers.length} জন):</div>
                        ${totals.issueMembers
                          .map(
                            (im) => `
                          <div style="font-size:12px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed #fca5a5;">
                            <strong>${im.name} (${im.bookNo})</strong> — <span class="badge badge-issue">${im.issueStatus}</span>
                            <div style="color:#7f1d1d;margin-top:2px;">${im.issueNote || ""}</div>
                          </div>
                        `
                          )
                          .join("")}
                      </div>`
                    : ""
                }
                ${
                  totals.dueMembers.length === 0
                    ? `<p style="font-size:14px;color:var(--success);font-weight:600;">কোনো সদস্যের বকেয়া নেই।</p>`
                    : totals.dueMembers
                        .map((m) => {
                          const fine = getMemberFine(m);
                          return `
                            <div style="border:1px solid #fecaca;background:#fff5f5;border-radius:10px;padding:10px;margin-bottom:8px;">
                              <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;">
                                <strong>${m.name} (${m.bookNo})</strong>
                                ${m.issueStatus ? `<span class="badge badge-issue">${m.issueStatus}</span>` : `<span class="badge badge-due">বাকি</span>`}
                              </div>
                              <div style="font-size:13px;margin-top:4px;">
                                চাঁদা: <strong>${formatTk(state.monthlyFee)}</strong> + জরিমানা: <strong style="color:var(--danger)">${formatTk(fine)}</strong>
                                ${m.fineWaived ? `<span class="badge badge-active" style="margin-left:4px;">জরিমানা বাদ</span>` : ""}
                              </div>
                              ${
                                m.fineWaiverRequested
                                  ? `<div style="font-size:12px;color:var(--warn);margin-top:4px;">
                                      জরিমানা না দেওয়ার আবেদন: "${m.fineWaiverReason || "কারণ উল্লেখ নেই"}"
                                    </div>`
                                  : ""
                              }
                            </div>
                          `;
                        })
                        .join("")
                }
              </div>

              <div class="card">
                <div class="card-header">
                  <div class="card-title">মেইন ব্যাংক জমা ও রিসিভ</div>
                  ${
                    role === "cashier" || role === "president" || role === "main"
                      ? `<button type="button" class="btn btn-primary btn-sm" id="btnAddBank">+ ব্যাংক জমা</button>`
                      : ""
                  }
                </div>
                ${state.bankDeposits
                  .map(
                    (b) => `
                  <div style="border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--surface-alt);">
                    <div style="font-weight:700;font-size:14px;">${b.bankName}</div>
                    <div style="font-size:13px;color:var(--primary);font-weight:700;margin-top:2px;">জমা: ${formatTk(b.amount)} (${b.date})</div>
                    <div style="font-size:12px;color:var(--muted);margin-top:2px;">${b.receiptNote || ""}</div>
                    <button type="button" class="btn btn-outline btn-sm" style="margin-top:6px;" data-view-receipt="${b.id}">রিসিভ দেখুন</button>
                  </div>
                `
                  )
                  .join("")}
              </div>
            </div>
          </div>
        `;

        bindOverviewEvents(role);
      }

      function bindOverviewEvents(role) {
        document.querySelectorAll("[data-pay]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-pay"));
            const m = state.members.find((x) => x.id === id);
            if (!m) return;
            const fine = getMemberFine(m);
            const fee = Number(state.monthlyFee || 500);
            const totalPay = fee + fine;

            m.paidThisMonth = true;
            m.fineWaiverRequested = false;
            m.totalDeposited = Number(m.totalDeposited || 0) + totalPay;

            state.transactions.unshift({
              id: Date.now(),
              type: "income",
              source: `মাসিক চাঁদা (${m.name} - ${m.bookNo})`,
              amount: totalPay,
              date: new Date().toISOString().slice(0, 10),
              status: "active",
              note:
                fine > 0
                  ? `১২ তারিখ পার হওয়ায় চাঁদা ${formatTk(fee)} + অটো জরিমানা ${formatTk(fine)}`
                  : m.fineWaived
                  ? `চাঁদা ${formatTk(fee)} (সভাপতির সম্মতিতে জরিমানা বাদ)`
                  : `নিয়মিত মাসিক চাঁদা ${formatTk(fee)}`
            });

            saveState();
            showToast(`${m.name}-এর ${formatTk(totalPay)} জমা সম্পন্ন হয়েছে`);
            render();
          };
        });

        document.querySelectorAll("[data-unpay]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-unpay"));
            const m = state.members.find((x) => x.id === id);
            if (!m) return;
            m.paidThisMonth = false;
            m.fineWaived = false;
            saveState();
            showToast(`${m.name}-এর স্ট্যাটাস বাকি করা হয়েছে`);
            render();
          };
        });

        document.querySelectorAll("[data-waiver-req]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-waiver-req"));
            const m = state.members.find((x) => x.id === id);
            if (!m) return;
            openModal(
              `জরিমানা না দেওয়ার আবেদন — ${m.name}`,
              `
              <form id="waiverForm">
                <div class="form-group">
                  <label>জরিমানা না দেওয়ার কারণ লিখুন (সভাপতি সম্মতি দিলে জরিমানা বাদ হবে)</label>
                  <textarea id="waiverReason" class="form-control" rows="3" required placeholder="যেমন: অসুস্থতা বা জরুরি পারিবারিক কারণ"></textarea>
                </div>
                <button type="submit" class="btn btn-warn">সভাপতির কাছে আবেদন পাঠান</button>
              </form>
            `
            );
            document.getElementById("waiverForm").onsubmit = (e) => {
              e.preventDefault();
              m.fineWaiverRequested = true;
              m.fineWaiverReason = document.getElementById("waiverReason").value.trim();
              saveState();
              closeModal();
              showToast("জরিমানা না দেওয়ার আবেদন সভাপতির কাছে পাঠানো হয়েছে");
              render();
            };
          };
        });

        document.querySelectorAll("[data-clear-fine]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-clear-fine"));
            const m = state.members.find((x) => x.id === id);
            if (!m) return;
            m.fineWaived = true;
            m.fineWaiverRequested = false;
            m.fineWaiverReason = "";
            saveState();
            showToast(`${m.name}-এর জরিমানা বাদ দেওয়া হয়েছে`);
            render();
          };
        });

        document.querySelectorAll("[data-clear-issue]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-clear-issue"));
            const m = state.members.find((x) => x.id === id);
            if (!m) return;
            m.issueStatus = "";
            m.issueNote = "";
            m.issueUpdatedAt = "";
            saveState();
            showToast(`${m.name}-এর সমস্যার স্ট্যাটাস ক্লিয়ার করা হয়েছে`);
            render();
          };
        });

        document.querySelectorAll("[data-del-member]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-del-member"));
            const m = state.members.find((x) => x.id === id);
            if (!m) return;
            openModal(
              "সদস্য ডিলিট নিশ্চিত করুন",
              `
              <p style="font-size:14px;margin-bottom:14px;">
                আপনি কি নিশ্চিত যে <strong>${m.name}</strong> (বই নং: <strong>${m.bookNo}</strong>)-কে তালিকা থেকে ডিলিট করতে চান?
              </p>
              <div style="display:flex;gap:8px;justify-content:flex-end;">
                <button type="button" class="btn btn-outline btn-sm" id="cancelDelMemberBtn">বাতিল</button>
                <button type="button" class="btn btn-danger btn-sm" id="confirmDelMemberBtn">হ্যাঁ, ডিলিট করুন</button>
              </div>
            `
            );
            document.getElementById("cancelDelMemberBtn").onclick = closeModal;
            document.getElementById("confirmDelMemberBtn").onclick = () => {
              state.members = state.members.filter((x) => x.id !== id);
              saveState();
              closeModal();
              showToast(`${m.name} ডিলিট করা হয়েছে`);
              render();
            };
          };
        });

        const addMemBtn = document.getElementById("btnAddMember");
        if (addMemBtn) {
          addMemBtn.onclick = () => {
            openModal(
              "নতুন সদস্য যোগ করুন (আলাদা ইউজার ও পাসওয়ার্ড তৈরি হবে)",
              `
              <form id="addMemberForm">
                <div class="form-grid">
                  <div class="form-group">
                    <label>সদস্যের নাম</label>
                    <input type="text" id="mName" class="form-control" required />
                  </div>
                  <div class="form-group">
                    <label>পদবি</label>
                    <input type="text" id="mPos" class="form-control" value="সাধারণ সদস্য" required />
                  </div>
                  <div class="form-group">
                    <label>বই নম্বর</label>
                    <input type="text" id="mBook" class="form-control" required placeholder="যেমন: B-106" />
                  </div>
                  <div class="form-group">
                    <label>ছবি আপলোড (ঐচ্ছিক)</label>
                    <input type="file" id="mPhotoFile" class="form-control" accept="image/*" />
                  </div>
                </div>
                <div class="form-grid">
                  <div class="form-group">
                    <label>ইউজারনেম (খালি রাখলে নাম অনুযায়ী তৈরি হবে)</label>
                    <input type="text" id="mUser" class="form-control" placeholder="অটো তৈরি হবে" />
                  </div>
                  <div class="form-group">
                    <label>পাসওয়ার্ড (খালি রাখলে অটো তৈরি হবে)</label>
                    <input type="text" id="mPass" class="form-control" placeholder="অটো তৈরি হবে" />
                  </div>
                </div>
                <button type="submit" class="btn btn-primary">সংরক্ষণ করুন</button>
              </form>
            `
            );
            document.getElementById("addMemberForm").onsubmit = (e) => {
              e.preventDefault();
              const newId = Date.now();
              const name = document.getElementById("mName").value.trim();
              const position = document.getElementById("mPos").value.trim();
              const bookNo = document.getElementById("mBook").value.trim();
              const customUser = document.getElementById("mUser").value.trim();
              const customPass = document.getElementById("mPass").value.trim();
              const file = document.getElementById("mPhotoFile").files[0];

              const createdUsername = customUser || slugifyUsername(name, newId);
              const createdPassword = customPass || generateMemberPassword(newId);

              const finishAdd = (photoData) => {
                state.members.push({
                  id: newId,
                  name,
                  username: createdUsername,
                  password: createdPassword,
                  position,
                  bookNo,
                  phone: "",
                  paidThisMonth: false,
                  totalDeposited: 0,
                  fineWaived: false,
                  fineWaiverRequested: false,
                  fineWaiverReason: "",
                  issueStatus: "",
                  issueNote: "",
                  issueUpdatedAt: "",
                  photo: photoData || makeAvatarDataUrl(name, "#0f766e")
                });
                saveState();
                openModal(
                  "সদস্যের লগইন তথ্য তৈরি হয়েছে",
                  `
                  <p style="font-size:14px;margin-bottom:10px;"><strong>${name}</strong>-এর জন্য আলাদা ইউজার ও পাসওয়ার্ড তৈরি হয়েছে:</p>
                  <div style="background:var(--surface-alt);padding:12px;border-radius:8px;border:1px solid var(--border);margin-bottom:14px;">
                    <div>ইউজারনেম: <strong>${createdUsername}</strong></div>
                    <div>পাসওয়ার্ড: <strong>${createdPassword}</strong></div>
                  </div>
                  <button type="button" class="btn btn-primary btn-sm" id="closeCredModalBtn">ঠিক আছে</button>
                `
                );
                document.getElementById("closeCredModalBtn").onclick = () => {
                  closeModal();
                  render();
                };
              };

              if (file) readFileAsDataUrl(file, finishAdd);
              else finishAdd(null);
            };
          };
        }

        document.querySelectorAll("[data-edit-member]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-edit-member"));
            const m = state.members.find((x) => x.id === id);
            if (!m) return;

            openModal(
              "সদস্যের তথ্য, লগইন ও সমস্যা আপডেট",
              `
              <form id="editMemberForm">
                <div class="form-grid">
                  <div class="form-group">
                    <label>নাম</label>
                    <input type="text" id="emName" class="form-control" value="${m.name}" required />
                  </div>
                  <div class="form-group">
                    <label>পদবি</label>
                    <input type="text" id="emPos" class="form-control" value="${m.position}" required />
                  </div>
                  <div class="form-group">
                    <label>বই নম্বর</label>
                    <input type="text" id="emBook" class="form-control" value="${m.bookNo}" required />
                  </div>
                  <div class="form-group">
                    <label>মোট জমা (টাকা)</label>
                    <input type="number" id="emDep" class="form-control" value="${m.totalDeposited}" required />
                  </div>
                </div>
                <div class="form-grid">
                  <div class="form-group">
                    <label>ইউজারনেম</label>
                    <input type="text" id="emUser" class="form-control" value="${m.username || ""}" required />
                  </div>
                  <div class="form-group">
                    <label>পাসওয়ার্ড</label>
                    <input type="text" id="emPass" class="form-control" value="${m.password || ""}" required />
                  </div>
                </div>
                <div class="form-grid">
                  <div class="form-group">
                    <label>সমস্যার অবস্থা</label>
                    <select id="emIssueStatus" class="form-control">
                      <option value="" ${!m.issueStatus ? "selected" : ""}>কোনো সমস্যা নেই</option>
                      <option value="অসুস্থ / টাকা দিতে সমস্যা" ${m.issueStatus === "অসুস্থ / টাকা দিতে সমস্যা" ? "selected" : ""}>অসুস্থ / টাকা দিতে সমস্যা</option>
                      <option value="অর্থনৈতিক সমস্যা" ${m.issueStatus === "অর্থনৈতিক সমস্যা" ? "selected" : ""}>অর্থনৈতিক সমস্যা</option>
                      <option value="জরুরি পারিবারিক সমস্যা" ${m.issueStatus === "জরুরি পারিবারিক সমস্যা" ? "selected" : ""}>জরুরি পারিবারিক সমস্যা</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label>সমস্যার বিবরণ</label>
                    <input type="text" id="emIssueNote" class="form-control" value="${m.issueNote || ""}" />
                  </div>
                </div>
                <div class="form-group">
                  <label>নতুন ছবি (ঐচ্ছিক)</label>
                  <input type="file" id="emPhoto" class="form-control" accept="image/*" />
                </div>
                <button type="submit" class="btn btn-primary">আপডেট করুন</button>
              </form>
            `
            );

            document.getElementById("editMemberForm").onsubmit = (e) => {
              e.preventDefault();
              m.name = document.getElementById("emName").value.trim();
              m.position = document.getElementById("emPos").value.trim();
              m.bookNo = document.getElementById("emBook").value.trim();
              m.totalDeposited = Number(document.getElementById("emDep").value || 0);
              m.username = document.getElementById("emUser").value.trim();
              m.password = document.getElementById("emPass").value.trim();
              m.issueStatus = document.getElementById("emIssueStatus").value;
              m.issueNote = m.issueStatus ? document.getElementById("emIssueNote").value.trim() : "";
              const file = document.getElementById("emPhoto").files[0];

              const done = () => {
                saveState();
                closeModal();
                showToast("সদস্যের তথ্য আপডেট হয়েছে");
                render();
              };

              if (file) {
                readFileAsDataUrl(file, (url) => {
                  m.photo = url;
                  done();
                });
              } else {
                done();
              }
            };
          };
        });

        const openTxModal = (type) => {
          const isInc = type === "income";
          const directActive = role === "president" || role === "main";
          openModal(
            isInc ? "নতুন আয় যোগ করুন" : "নতুন ব্যয় যোগ করুন",
            `
            <form id="txForm">
              <div class="form-group">
                <label>খাতের নাম</label>
                <input type="text" id="txSource" class="form-control" required placeholder="${isInc ? "যেমন: অনুদান বা বিশেষ আয়" : "যেমন: ত্রাণ, অনুষ্ঠান বা অফিস খরচ"}" />
              </div>
              <div class="form-grid">
                <div class="form-group">
                  <label>পরিমাণ (টাকা)</label>
                  <input type="number" id="txAmount" class="form-control" min="1" required />

                  <label>তারিখ</label>
                  <input type="date" id="txDate" class="form-control" value="${new Date().toISOString().slice(0, 10)}" required />

            e.preventDefault();
            state.transactions.unshift({
              id: Date.now(),
              type,

              amount: Number(document.getElementById("txAmount").value || 0),
              date: document.getElementById("txDate").value,
              status: directActive ? "active" : "pending",

        if (addExpBtn) addExpBtn.onclick = () => openTxModal("expense");

        document.querySelectorAll("[data-edit-tx]").forEach((btn) => {

            if (!tx) return;

            openModal(

                  <input type="text" id="etxSource" class="form-control" value="${tx.source}" required />

                <div class="form-group">
                  <label>পরিমাণ (টাকা)</label>
                  <input type="number" id="etxAmount" class="form-control" value="${tx.amount}" min="1" required />

                <div class="form-group">
                  <label>মন্তব্য</label>
                  <input type="text" id="etxNote" class="form-control" value="${tx.note || ""}" />

              </form>
            `
            );

            document.getElementById("editTxForm").onsubmit = (e) => {
              e.preventDefault();
              tx.source = document.getElementById("etxSource").value.trim();
              tx.amount = Number(document.getElementById("etxAmount").value || 0);
              tx.note = document.getElementById("etxNote").value.trim();
              tx.status = "pending";
              saveState();
              closeModal();
              showToast("হিসাব এডিট হয়েছে — সভাপতি ওকে করলে সচল হবে");
              render();
            };
          };
        });

        document.querySelectorAll("[data-approve-tx]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-approve-tx"));
            const tx = state.transactions.find((x) => x.id === id);
            if (!tx) return;
            tx.status = "active";
            saveState();
            showToast("হিসাব সচল করা হয়েছে");
            render();
          };
        });

        document.querySelectorAll("[data-del-tx]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-del-tx"));
            state.transactions = state.transactions.filter((x) => x.id !== id);
            saveState();
            showToast("হিসাব মুছে ফেলা হয়েছে");
            render();
          };
        });

        const addBankBtn = document.getElementById("btnAddBank");
        if (addBankBtn) {
          addBankBtn.onclick = () => {
            openModal(
              "ব্যাংকে টাকা জমা ও রিসিভ আপলোড",
              `
              <form id="bankForm">
                <div class="form-group">
                  <label>ব্যাংকের নাম ও অ্যাকাউন্ট নম্বর</label>
                  <input type="text" id="bName" class="form-control" required placeholder="যেমন: ইসলামী ব্যাংক বাংলাদেশ (হিসাব নং: ...)" />
                </div>
                <div class="form-grid">
                  <div class="form-group">
                    <label>জমার পরিমাণ (টাকা)</label>
                    <input type="number" id="bAmt" class="form-control" min="1" required />
                  </div>
                  <div class="form-group">
                    <label>তারিখ</label>
                    <input type="date" id="bDate" class="form-control" value="${new Date().toISOString().slice(0, 10)}" required />
                  </div>
                </div>
                <div class="form-group">
                  <label>রিসিভ / স্লিপ নোট</label>
                  <input type="text" id="bNote" class="form-control" placeholder="রিসিভ নম্বর বা মন্তব্য" />
                </div>
                <div class="form-group">
                  <label>ব্যাংক রিসিভের ছবি (ঐচ্ছিক)</label>
                  <input type="file" id="bImg" class="form-control" accept="image/*" />
                </div>
                <button type="submit" class="btn btn-primary">ব্যাংক জমা সংরক্ষণ</button>
              </form>
            `
            );

            document.getElementById("bankForm").onsubmit = (e) => {
              e.preventDefault();
              const bankName = document.getElementById("bName").value.trim();
              const amount = Number(document.getElementById("bAmt").value || 0);
              const date = document.getElementById("bDate").value;
              const receiptNote = document.getElementById("bNote").value.trim();
              const file = document.getElementById("bImg").files[0];

              const saveBank = (imgUrl) => {
                state.bankDeposits.unshift({
                  id: Date.now(),
                  bankName,
                  amount,
                  date,
                  receiptNote,
                  receiptImg: imgUrl || makeLogoDataUrl("রিসিভ")
                });
                saveState();
                closeModal();
                showToast("ব্যাংক জমা ও রিসিভ যুক্ত হয়েছে");
                render();

              else saveBank(null);

        document.querySelectorAll("[data-view-receipt]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-view-receipt"));
            const b = state.bankDeposits.find((x) => x.id === id);
            if (!b) return;
            openModal(
              "ব্যাংক জমা রিসিভ",
              `
              <p style="font-size:14px;margin-bottom:8px;"><strong>${b.bankName}</strong></p>
              <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">পরিমাণ: ${formatTk(b.amount)} | তারিখ: ${b.date} | ${b.receiptNote || ""}</p>
              <img src="${b.receiptImg}" alt="ব্যাংক রিসিভ" style="width:100%;max-height:360px;object-fit:contain;border:1px solid var(--border);border-radius:8px;" />
            `
            );
          };
        });
      }

      function renderMessagesTab(container, role) {
        const canSend = role === "president" || role === "cashier" || role === "main";
        const senderLabel = role === "cashier" ? "ক্যাশিয়ার" : "সভাপতি";

        if (role === "member") {
          markMemberNotificationsSeen();
        }

        container.innerHTML = `
          <div class="card">
            <div class="card-header">
              <div class="card-title">সংগঠনের মেসেজ ও নোটিশ বোর্ড</div>
            </div>
            ${
              canSend
                ? `<form id="msgForm" style="margin-bottom:16px;">
                    <div class="form-grid">
                      <div class="form-group">
                        <label>প্রেরক</label>
                        <input type="text" class="form-control" readonly value="${senderLabel}" />
                      </div>
                      <div class="form-group">
                        <label>প্রাপক গ্রুপ</label>
                        <select id="msgTarget" class="form-control">
                          <option value="সকল সদস্য">সকল সদস্য</option>
                          <option value="বকেয়া সদস্যবৃন্দ">বকেয়া সদস্যবৃন্দ</option>
                        </select>
                      </div>
                    </div>
                    <div class="form-group">
                      <label>মেসেজ লিখুন (পাঠালে বা আপডেট দিলে মেম্বার প্যানেলে নোটিফিকেশন যাবে)</label>
                      <textarea id="msgText" class="form-control" rows="2" required placeholder="সদস্যদের উদ্দেশ্যে বার্তা লিখুন..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">${senderLabel} হিসেবে মেসেজ পাঠান</button>
                  </form>`
                : `<p style="font-size:13px;color:var(--muted);margin-bottom:12px;">সভাপতি ও ক্যাশিয়ারের পাঠানো বা আপডেট করা সকল মেসেজ নিচে দেখা যাচ্ছে।</p>`
            }

            <div class="msg-list">
              ${state.messages
                .map(
                  (msg) => `
                <div class="msg-item">
                  <div class="msg-meta">
                    <div>
                      <span class="msg-sender">${msg.senderRole} → ${msg.target}</span>
                      ${msg.edited ? `<span class="badge badge-pending" style="margin-left:6px;">আপডেটকৃত</span>` : ""}
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;">
                      <span>${msg.time}</span>
                      ${
                        canSend
                          ? `<button type="button" class="btn btn-outline btn-sm" data-edit-msg="${msg.id}">মেসেজ আপডেট</button>`
                          : ""
                      }
                    </div>
                  </div>
                  <div style="font-size:14px;">${msg.text}</div>
                </div>
              `
                )
                .join("")}
            </div>
          </div>
        `;

        if (canSend) {
          document.getElementById("msgForm").onsubmit = (e) => {
            e.preventDefault();
            const text = document.getElementById("msgText").value.trim();
            const target = document.getElementById("msgTarget").value;
            if (!text) return;

            const now = Date.now();
            const newMsg = {
              id: now,
              senderRole: senderLabel,
              target,
              text,
              time: "এইমাত্র",
              updatedAt: now,
              edited: false
            };

            state.messages.unshift(newMsg);
            state.latestMessageNotice = {
              id: newMsg.id,
              senderRole: senderLabel,
              target,
              text,
              updatedAt: now,
              isEdited: false
            };

            saveState();
            showToast(`${senderLabel} নামে মেসেজ পাঠানো হয়েছে — মেম্বার প্যানেলে নোটিফিকেশন গেছে`);
            render();
          };

          container.querySelectorAll("[data-edit-msg]").forEach((btn) => {
            btn.onclick = () => {
              const id = Number(btn.getAttribute("data-edit-msg"));
              const msgObj = state.messages.find((x) => x.id === id);
              if (!msgObj) return;

              openModal(
                "মেসেজ আপডেট করুন (মেম্বার প্যানেলে নোটিফিকেশন যাবে)",

                <form id="editMsgForm">
                  <div class="form-group">
                    <label>প্রাপক গ্রুপ</label>
                    <select id="editMsgTarget" class="form-control">
                      <option value="সকল সদস্য" ${msgObj.target === "সকল সদস্য" ? "selected" : ""}>সকল সদস্য</option>
                      <option value="বকেয়া সদস্যবৃন্দ" ${msgObj.target === "বকেয়া সদস্যবৃন্দ" ? "selected" : ""}>বকেয়া সদস্যবৃন্দ</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label>আপডেটকৃত মেসেজ</label>
                    <textarea id="editMsgText" class="form-control" rows="3" required>${msgObj.text}</textarea>
                  </div>
                  <button type="submit" class="btn btn-primary">আপডেট সেভ করুন ও নোটিফিকেশন পাঠান</button>
                </form>
              `
              );

              document.getElementById("editMsgForm").onsubmit = (e) => {
                e.preventDefault();
                const updatedText = document.getElementById("editMsgText").value.trim();
                const updatedTarget = document.getElementById("editMsgTarget").value;
                if (!updatedText) return;

                const now = Date.now();
                msgObj.text = updatedText;
                msgObj.target = updatedTarget;
                msgObj.time = "আপডেট: এইমাত্র";
                msgObj.updatedAt = now;
                msgObj.edited = true;

                state.latestMessageNotice = {
                  id: msgObj.id,
                  senderRole: senderLabel,
                  target: updatedTarget,
                  text: updatedText,
                  updatedAt: now,
                  isEdited: true
                };

                saveState();
                closeModal();
                showToast("মেসেজ আপডেট হয়েছে — মেম্বার প্যানেলে নোটিফিকেশন গেছে");
                render();
              };
            };
          });
        }
      }

                `
                    )
                    .join("")

              showToast("হিসাব সচল করা হয়েছে");
              render();

              showToast("আবেদন প্রত্যাখ্যান করা হয়েছে");

                </div>
                <div class="form-group">
                  <label>মাসিক চাঁদা (টাকা)</label>
                  <input type="number" id="setFee" class="form-control" value="${state.monthlyFee}" required />
                </div>
                <div class="form-group">
                  <label>জরিমানা ছাড়া শেষ তারিখ (প্রতি মাসের)</label>
                  <input type="number" id="setGraceDay" class="form-control" min="1" max="28" value="${state.graceEndDay}" required />
                </div>
                <div class="form-group">
                  <label>জরিমানার পরিমাণ (টাকা)</label>
                  <input type="number" id="setFineAmt" class="form-control" min="0" value="${state.fineAmount}" required />
                </div>
                <div class="form-group">
                  <label>সভাপতি পিন (বদলালে মেইন পেজে শো করবে)</label>
                  <input type="text" id="setPresPin" class="form-control" value="${state.pins.president}" required />
                </div>
                <div class="form-group">
                  <label>ক্যাশিয়ার পিন (বদলালে মেইন পেজে শো করবে)</label>
                  <input type="text" id="setCashPin" class="form-control" value="${state.pins.cashier}" required />
                </div>
              </div>
              <button type="submit" class="btn btn-primary">সেটিংস সংরক্ষণ করুন</button>
            </form>
          </div>
        `;

        document.getElementById("presSettingsForm").onsubmit = (e) => {
          e.preventDefault();
          state.orgName = document.getElementById("setOrgName").value.trim();
          state.monthlyFee = Number(document.getElementById("setFee").value || 500);
          state.graceEndDay = Number(document.getElementById("setGraceDay").value || 12);
          state.fineAmount = Number(document.getElementById("setFineAmt").value || 100);
          state.pins.president = document.getElementById("setPresPin").value.trim() || "1111";
          state.pins.cashier = document.getElementById("setCashPin").value.trim() || "2222";
          saveState();
          showToast("সেটিংস ও নতুন পিন সংরক্ষণ হয়েছে — মেইন পেজে শো করবে");
          if (role === "main") renderMainPortal(document.getElementById("appRoot"));
          else render();
        };
      }

      function openOrgSettingsModal() {
        openModal(
          "সংগঠনের লোগো ও তথ্য পরিবর্তন",
          `
          <form id="logoForm">
            <div class="form-group">
              <label>সংগঠনের নাম</label>
              <input type="text" id="modalOrgName" class="form-control" value="${state.orgName}" required />
            </div>
            <div class="form-group">
              <label>স্লোগান / সংক্ষিপ্ত বিবরণ</label>
              <input type="text" id="modalOrgSub" class="form-control" value="${state.orgSlogan}" />
            </div>
            <div class="form-group">
              <label>লোগো ছবি আপলোড</label>
              <input type="file" id="modalLogoFile" class="form-control" accept="image/*" />
            </div>
            <button type="submit" class="btn btn-primary">সংরক্ষণ</button>
          </form>
        `
        );

        document.getElementById("logoForm").onsubmit = (e) => {
          e.preventDefault();
          state.orgName = document.getElementById("modalOrgName").value.trim();
          state.orgSlogan = document.getElementById("modalOrgSub").value.trim();
          const file = document.getElementById("modalLogoFile").files[0];

          const finish = () => {
            saveState();
            closeModal();
            showToast("সংগঠনের লোগো ও নাম আপডেট হয়েছে");
            render();
          };

          if (file) {
            readFileAsDataUrl(file, (url) => {
              state.logoUrl = url;
              finish();
            });
          } else {
            finish();
          }
        };
      }

      function downloadA4Statement() {
        const totals = computeTotals();
        const sheet = document.getElementById("a4StatementSheet");

        sheet.innerHTML = `
          <div style="font-family:'Hind Siliguri',sans-serif;color:#0f172a;padding:8px;">
            <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #0f766e;padding-bottom:12px;margin-bottom:16px;">
              <div style="display:flex;align-items:center;gap:12px;">
                <img src="${state.logoUrl}" alt="লোগো" style="width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid #cbd5e1;" />
                <div>
                  <h1 style="font-size:22px;margin:0;">${state.orgName}</h1>
                  <div style="font-size:13px;color:#475569;">${state.orgSlogan}</div>
                </div>
              </div>
              <div style="text-align:right;font-size:12px;color:#475569;">
                <div><strong>সদস্যদের টোটাল হিসাব স্টেটমেন্ট (A4)</strong></div>
                <div>তারিখ: ${new Date().toLocaleDateString("bn-BD")}</div>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;">
              <div style="border:1px solid #cbd5e1;padding:10px;border-radius:8px;">
                <div style="font-size:11px;color:#475569;">অনুমোদিত মোট আয়</div>
                <div style="font-size:16px;font-weight:700;color:#16a34a;">${formatTk(totals.activeIncome)}</div>
              </div>
              <div style="border:1px solid #cbd5e1;padding:10px;border-radius:8px;">
                <div style="font-size:11px;color:#475569;">অনুমোদিত মোট ব্যয়</div>
                <div style="font-size:16px;font-weight:700;color:#dc2626;">${formatTk(totals.activeExpense)}</div>
              </div>
              <div style="border:1px solid #cbd5e1;padding:10px;border-radius:8px;">
                <div style="font-size:11px;color:#475569;">নিট তহবিল</div>
                <div style="font-size:16px;font-weight:700;color:#0f766e;">${formatTk(totals.netFund)}</div>
              </div>
              <div style="border:1px solid #cbd5e1;padding:10px;border-radius:8px;">
                <div style="font-size:11px;color:#475569;">মোট ব্যাংক জমা</div>
                <div style="font-size:16px;font-weight:700;color:#2563eb;">${formatTk(totals.totalBank)}</div>
              </div>
            </div>

            <h3 style="font-size:15px;margin-bottom:8px;">সকল সদস্যের টোটাল হিসাব তালিকা</h3>
            <table style="width:100%;border-collapse:collapse;font-size:13px;">
              <thead>
                <tr style="background:#f1f5f9;">
                  <th style="border:1px solid #cbd5e1;padding:8px;text-align:left;">ছবি, নাম ও সমস্যা</th>
                  <th style="border:1px solid #cbd5e1;padding:8px;text-align:left;">পদবি</th>
                  <th style="border:1px solid #cbd5e1;padding:8px;text-align:left;">বই নং</th>
                  <th style="border:1px solid #cbd5e1;padding:8px;text-align:right;">মোট জমা</th>
                  <th style="border:1px solid #cbd5e1;padding:8px;text-align:center;">স্ট্যাটাস</th>
                  <th style="border:1px solid #cbd5e1;padding:8px;text-align:right;">জরিমানা</th>
                </tr>
              </thead>
              <tbody>
                ${state.members
                  .map((m) => {
                    const fine = getMemberFine(m);
                    return `
                      <tr>
                        <td style="border:1px solid #cbd5e1;padding:6px 8px;">
                          <div style="display:flex;align-items:center;gap:8px;">
                            <img src="${m.photo}" alt="${m.name}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid #cbd5e1;" />
                            <div>
                              <strong>${m.name}</strong>
                              ${m.issueStatus ? `<div style="font-size:11px;color:#dc2626;">[${m.issueStatus}] ${m.issueNote || ""}</div>` : ""}
                            </div>
                          </div>
                        </td>
                        <td style="border:1px solid #cbd5e1;padding:6px 8px;">${m.position}</td>
                        <td style="border:1px solid #cbd5e1;padding:6px 8px;">${m.bookNo}</td>
                        <td style="border:1px solid #cbd5e1;padding:6px 8px;text-align:right;"><strong>${formatTk(m.totalDeposited)}</strong></td>
                        <td style="border:1px solid #cbd5e1;padding:6px 8px;text-align:center;">${m.paidThisMonth ? "পরিশোধ" : "বাকি"}</td>
                        <td style="border:1px solid #cbd5e1;padding:6px 8px;text-align:right;">${formatTk(fine)}</td>
                      </tr>
                    `;
                  })
                  .join("")}
              </tbody>
            </table>
          </div>
        `;

        window.print();
      }

      function render() {
        if (ensureMonthlyCollectionCycle(state)) {
          saveState();
        }

        const route = getRoute();
        renderHeader(route);

        const root = document.getElementById("appRoot");
        if (route === "main") {
          renderMainPortal(root);
        } else if (route === "president") {
          if (!unlockedRoles.president) renderPinLogin(root, "president");
          else renderRoleWorkspace(root, "president");
        } else if (route === "cashier") {
          if (!unlockedRoles.cashier) renderPinLogin(root, "cashier");
          else renderRoleWorkspace(root, "cashier");
        } else if (route === "member") {
          if (!loggedInMemberId) renderMemberLogin(root);
          else renderRoleWorkspace(root, "member");
        }
      }

      let currentLockedRole = getRoute();

      window.addEventListener("hashchange", () => {
        const nextRoute = getRoute();
        if (currentLockedRole !== "main" && nextRoute === "main") {
          window.location.hash = "#" + currentLockedRole;
          showToast("এই পেজ থেকে মেইন পেজে যাওয়ার অনুমতি নেই");
          return;
        }
        currentLockedRole = nextRoute;
        activeTab = "overview";
        render();
      });

      initFirebaseRealtime();
      render();
    })();
  </script>
</body>
</html>
