<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>সংগঠন ও তহবিল ব্যবস্থাপনা সিস্টেম</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #0f766e;
      --primary-hover: #115e59;
      --primary-soft: #ccfbf1;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --warn: #d97706;
      --warn-soft: #fef3c7;
      --info: #2563eb;
      --info-soft: #dbeafe;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Hind Siliguri', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 18px 16px 56px;
    }

    /* Top Header */
    .topbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .org-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-wrap {
      position: relative;
      width: 54px;
      height: 54px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .logo-cam-btn {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .org-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    .org-sub {
      font-size: 13px;
      color: var(--muted);
    }

    .topbar-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .role-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      background: var(--primary-soft);
      color: var(--primary);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-outline {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-outline:hover {
      background: var(--surface-alt);
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-warn {
      background: var(--warn);
      color: #fff;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    /* Nav Tabs */
    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .nav-tab {
      padding: 9px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Cards & Grids */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    .stat-val {
      font-size: 24px;
      font-weight: 700;
      margin-top: 4px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.65fr 1fr;
      gap: 16px;
    }

    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Alert & Banner */
    .due-banner {
      background: var(--danger-soft);
      border: 1px solid #fca5a5;
      color: #991b1b;
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      padding: 10px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: var(--surface-alt);
      font-weight: 700;
      color: var(--text);
    }

    /* Avatars & Badges */
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      flex-shrink: 0;
    }

    .member-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge-paid {
      background: var(--success-soft);
      color: var(--success);
    }

    .badge-due {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .badge-pending {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .badge-active {
      background: var(--success-soft);
      color: var(--success);
    }

    /* Portal Cards */
    .portal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .portal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .link-box {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .link-input {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      background: var(--surface-alt);
      color: var(--text);
    }

    /* Messages */
    .msg-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 360px;
      overflow-y: auto;
    }

    .msg-item {
      border: 1px solid var(--border);
      background: var(--surface-alt);
      border-radius: 10px;
      padding: 12px;
    }

    .msg-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .msg-sender {
      font-weight: 700;
      color: var(--primary);
    }

    /* Position / Role Directory Grid */
    .dir-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .dir-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      background: var(--surface);
    }

    .dir-photo {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary-soft);
      margin: 0 auto 10px;
      display: block;
    }

    /* Forms & Modals */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: var(--surface);
      color: var(--text);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal-card {
      background: var(--surface);
      border-radius: var(--radius);
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 20px 35px rgba(15, 23, 42, 0.2);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--text);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      z-index: 2000;
      display: none;
    }

    .toast.show {
      display: block;
    }

    /* A4 Statement Print Styles */
    @media print {
      body {
        background: #fff !important;
      }
      .no-print {
        display: none !important;
      }
      .print-only-sheet {
        display: block !important;
      }
      @page {
        size: A4 portrait;
        margin: 12mm;
      }
    }

    .print-only-sheet {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container no-print">
    <!-- Top Header -->
    <header class="topbar">
      <div class="org-brand">
        <div class="logo-wrap">
          <img id="headerLogo" src="" alt="লোগো" />
          <button type="button" class="logo-cam-btn" id="logoEditBtn" title="লোগো ও নাম পরিবর্তন">✎</button>
        </div>
        <div>
          <div class="org-title" id="headerOrgName">আলোর পথ কল্যাণ সংগঠন</div>
          <div class="org-sub" id="headerOrgSub">ঐক্য, সেবা ও স্বচ্ছ তহবিল ব্যবস্থাপনা</div>
        </div>
      </div>

      <div class="topbar-actions" id="topbarActions"></div>
    </header>

    <!-- Dynamic App Area -->
    <div id="appRoot"></div>
  </div>

  <!-- A4 Printable Statement Sheet -->
  <div id="a4StatementSheet" class="print-only-sheet"></div>

  <!-- Reusable Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button type="button" class="btn btn-outline btn-sm" id="modalCloseBtn">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toastBox"></div>

  <script>
    (function () {
      const STORAGE_KEY = "org_fund_mgmt_v1";

      function makeAvatarDataUrl(label, bgColor) {
        const safe = (label || "স").slice(0, 2);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
          <rect width="120" height="120" rx="60" fill="${bgColor || '#0f766e'}"/>
          <text x="60" y="72" text-anchor="middle" font-size="42" font-family="sans-serif" font-weight="bold" fill="#ffffff">${safe}</text>
        </svg>`;
        return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
      }

      function makeLogoDataUrl(text) {
        const safe = (text || "সংগঠন").slice(0, 4);

          <circle cx="60" cy="46" r="22" fill="#ccfbf1"/>
          <text x="60" y="53" text-anchor="middle" font-size="18" font-family="sans-serif" font-weight="bold" fill="#0f766e">★</text>
          <text x="60" y="94" text-anchor="middle" font-size="18" font-family="sans-serif" font-weight="bold" fill="#ffffff">${safe}</text>
        </svg>`;
        return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
      }

      const defaultState = {

          {

            target: "সকল সদস্য",
            text: "আগামী শুক্রবার বিকেল ৪টায় সংগঠনের জরুরি সভা অনুষ্ঠিত হবে। সবাইকে উপস্থিত থাকার অনুরোধ করা হলো।",

          },
          {
            id: 302,
            senderRole: "ক্যাশিয়ার",
            target: "বকেয়া সদস্যবৃন্দ",
            text: "যাদের চলতি মাসের চাঁদা বাকি রয়েছে, জরিমানা এড়াতে দ্রুত পরিশোধ করার জন্য অনুরোধ করা হচ্ছে।",
            time: "গতকাল, ০৫:১৫ PM"
          }
        ]
      };

      let state = loadState();
      let unlockedRoles = { president: false, cashier: false };
      let activeTab = "overview";

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return structuredClone(defaultState);
          const parsed = JSON.parse(raw);
          return Object.assign(structuredClone(defaultState), parsed);
        } catch (err) {
          return structuredClone(defaultState);
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          // Ignore storage quota issues in restricted environments
        }
      }

      function showToast(msg) {
        const el = document.getElementById("toastBox");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => el.classList.remove("show"), 2600);
      }

      function getRoute() {
        const h = (window.location.hash || "").replace(/^#/, "").toLowerCase();
        if (h === "president" || h === "cashier" || h === "member" || h === "main") {
          return h;
        }
        return "main";
      }

      function setRoute(route) {
        currentLockedRole = route;
        window.location.hash = "#" + route;

      function getRoleLink(role) {
        const base = window.location.href.split("#")[0];
        return base + "#" + role;

      function copyToClipboard(text, label) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            () => showToast((label || "লিংক") + " কপি হয়েছে"),
            () => fallbackCopy(text, label)
          );
        } else {
          fallbackCopy(text, label);
        }
      }

      function fallbackCopy(text, label) {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast((label || "লিংক") + " কপি হয়েছে");
      }

      function formatTk(num) {
        const n = Number(num || 0);
        return "৳" + n.toLocaleString("bn-BD");
      }

      function computeTotals() {
        let activeIncome = 0;
        let activeExpense = 0;
        let pendingCount = 0;

        state.transactions.forEach((t) => {
          if (t.status === "active") {
            if (t.type === "income") activeIncome += Number(t.amount || 0);
            if (t.type === "expense") activeExpense += Number(t.amount || 0);
          } else {
            pendingCount += 1;
          }
        });

        const netFund = activeIncome - activeExpense;
        const totalBank = state.bankDeposits.reduce((sum, b) => sum + Number(b.amount || 0), 0);
        const dueMembers = state.members.filter((m) => !m.paidThisMonth);
        const totalFines = dueMembers.reduce((sum, m) => sum + (state.deadlinePassed ? Number(m.fineDue || state.fineAmount) : 0), 0);

        return {
          activeIncome,
          activeExpense,
          netFund,
          totalBank,
          pendingCount,
          dueMembers,
          totalFines
        };
      }

                              ${
                                fine > 0
                                  ? `<button type="button" class="btn btn-danger btn-sm" data-clear-fine="${m.id}">জরিমানা বাতিল</button>`
                                  : ""
                              }
                            </div>`;
                          }

                          return `
                            <tr>
                              <td>
                                <div class="member-cell">
                                  <img src="${m.photo}" alt="${m.name}" class="avatar" />
                                  <div>
                                    <div style="font-weight:700;">${m.name}</div>
                                    <div style="font-size:12px;color:var(--muted);">${m.position}</div>
                                  </div>
                                </div>
                              </td>
                              <td><strong>${m.bookNo}</strong></td>
                              <td><strong>${formatTk(m.totalDeposited)}</strong></td>
                              <td>${statusBadge}</td>
                              <td>${fine > 0 ? `<strong style="color:var(--danger)">${formatTk(fine)}</strong>` : formatTk(0)}</td>
                              <td>${actionHtml}</td>
                            </tr>
                          `;
                        })
                        .join("")}
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- Income & Expense Ledger -->
              <div class="card">
                <div class="card-header">
                  <div class="card-title">খাতভিত্তিক আয় ও ব্যয় হিসাব</div>
                  ${
                    role === "cashier" || role === "president"
                      ? `<div style="display:flex;gap:6px;flex-wrap:wrap;">
                          <button type="button" class="btn btn-success btn-sm" id="btnAddIncome">+ আয় যোগ</button>
                          <button type="button" class="btn btn-danger btn-sm" id="btnAddExpense">- ব্যয় যোগ</button>
                        </div>`
                      : ""
                  }
                </div>
                <p style="font-size:12px;color:var(--muted);margin-bottom:10px;">
                  ক্যাশিয়ার আয়-ব্যয় যোগ বা এডিট করলে তা প্রথমে <strong>অসম্পূর্ণ</strong> থাকে; সভাপতি অনুমোদন দিলে <strong>সচল</strong> হয় এবং মূল হিসাবে যুক্ত হয়।
                </p>
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>খাত ও বিবরণ</th>
                        <th>ধরন</th>
                        <th>পরিমাণ</th>
                        <th>অবস্থা</th>
                        <th>অ্যাকশন</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${state.transactions
                        .map((t) => {
                          const isActive = t.status === "active";
                          const stBadge = isActive
                            ? `<span class="badge badge-active">সচল</span>`
                            : `<span class="badge badge-pending">অসম্পূর্ণ</span>`;
                          const typeLabel =
                            t.type === "income"
                              ? `<span style="color:var(--success);font-weight:700;">আয়</span>`
                              : `<span style="color:var(--danger);font-weight:700;">ব্যয়</span>`;

                          let act = "";
                          if (role === "cashier") {
                            act = `<button type="button" class="btn btn-outline btn-sm" data-edit-tx="${t.id}">এডিট</button>`;
                          } else if (role === "president") {
                            act = `<div style="display:flex;gap:4px;">
                              ${
                                !isActive
                                  ? `<button type="button" class="btn btn-success btn-sm" data-approve-tx="${t.id}">ওকে / সচল</button>`
                                  : ""
                              }
                              <button type="button" class="btn btn-danger btn-sm" data-del-tx="${t.id}">মুছুন</button>
                            </div>`;
                          } else {
                            act = `<span style="font-size:12px;color:var(--muted);">-</span>`;
                          }

                          return `
                            <tr>
                              <td>
                                <div style="font-weight:700;">${t.source}</div>
                                <div style="font-size:12px;color:var(--muted);">${t.date} • ${t.note || ""}</div>
                              </td>
                              <td>${typeLabel}</td>
                              <td><strong>${formatTk(t.amount)}</strong></td>
                              <td>${stBadge}</td>
                              <td>${act}</td>
                            </tr>
                          `;
                        })
                        .join("")}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- Right Column: Defaulter Box & Bank Deposits -->
            <div>
              <div class="card" style="border-color:#fca5a5;">
                <div class="card-header">
                  <div class="card-title" style="color:var(--danger);">বকেয়া ও ১০০ টাকা জরিমানা বক্স</div>
                </div>
                ${
                  totals.dueMembers.length === 0
                    ? `<p style="font-size:14px;color:var(--success);font-weight:600;">কোনো সদস্যের বকেয়া নেই।</p>`
                    : totals.dueMembers
                        .map((m) => {
                          const fine = state.deadlinePassed ? Number(m.fineDue || state.fineAmount) : 0;
                          return `
                            <div style="border:1px solid #fecaca;background:#fff5f5;border-radius:10px;padding:10px;margin-bottom:8px;">
                              <div style="display:flex;justify-content:space-between;align-items:center;">
                                <strong>${m.name} (${m.bookNo})</strong>
                                <span class="badge badge-due">বাকি</span>
                              </div>
                              <div style="font-size:13px;margin-top:4px;">
                                চাঁদা: <strong>${formatTk(state.monthlyFee)}</strong> + জরিমানা: <strong style="color:var(--danger)">${formatTk(fine)}</strong>
                              </div>
                              ${
                                m.fineWaiverRequested
                                  ? `<div style="font-size:12px;color:var(--warn);margin-top:4px;">
                                      মওকুফ আবেদন: "${m.fineWaiverReason || "কারণ উল্লেখ নেই"}"
                                    </div>`
                                  : ""
                              }
                            </div>
                          `;
                        })
                        .join("")
                }
              </div>

              <div class="card">
                <div class="card-header">
                  <div class="card-title">মেইন ব্যাংক জমা ও রিসিভ</div>
                  ${
                    role === "cashier" || role === "president"
                      ? `<button type="button" class="btn btn-primary btn-sm" id="btnAddBank">+ ব্যাংক জমা</button>`
                      : ""
                  }
                </div>
                ${state.bankDeposits
                  .map(
                    (b) => `
                  <div style="border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--surface-alt);">
                    <div style="font-weight:700;font-size:14px;">${b.bankName}</div>
                    <div style="font-size:13px;color:var(--primary);font-weight:700;margin-top:2px;">জমা: ${formatTk(b.amount)} (${b.date})</div>
                    <div style="font-size:12px;color:var(--muted);margin-top:2px;">${b.receiptNote || ""}</div>
                    <button type="button" class="btn btn-outline btn-sm" style="margin-top:6px;" data-view-receipt="${b.id}">রিসিভ দেখুন</button>
                  </div>
                `
                  )
                  .join("")}
              </div>
            </div>
          </div>
        `;

        bindOverviewEvents(role);
      }

      function bindOverviewEvents(role) {
        // Collect monthly fee
        document.querySelectorAll("[data-pay]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-pay"));
            const m = state.members.find((x) => x.id === id);
            if (!m) return;
            const fine = !m.paidThisMonth && state.deadlinePassed ? Number(m.fineDue || state.fineAmount) : 0;
            const totalPay = Number(state.monthlyFee) + fine;

            m.paidThisMonth = true;
            m.fineDue = 0;
            m.fineWaiverRequested = false;
            m.totalDeposited = Number(m.totalDeposited || 0) + totalPay;

            state.transactions.unshift({
              id: Date.now(),
              type: "income",
              source: `মাসিক চাঁদা (${m.name} - ${m.bookNo})`,
              amount: totalPay,
              date: new Date().toISOString().slice(0, 10),
              status: "active",
              note: fine > 0 ? `চাঁদা ${state.monthlyFee} + জরিমানা ${fine}` : "নিয়মিত মাসিক চাঁদা"
            });

            saveState();
            showToast(`${m.name}-এর ${formatTk(totalPay)} জমা সম্পন্ন হয়েছে`);
            render();
          };
        });

        // President mark unpaid
        document.querySelectorAll("[data-unpay]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-unpay"));
            const m = state.members.find((x) => x.id === id);
            if (!m) return;
            m.paidThisMonth = false;
            m.fineDue = state.deadlinePassed ? state.fineAmount : 0;
            saveState();
            showToast(`${m.name}-এর স্ট্যাটাস বাকি করা হয়েছে`);
            render();
          };
        });

        // Cashier request fine waiver
        document.querySelectorAll("[data-waiver-req]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-waiver-req"));
            const m = state.members.find((x) => x.id === id);
            if (!m) return;
            openModal(
              `জরিমানা মওকুফের আবেদন — ${m.name}`,
              `
              <form id="waiverForm">
                <div class="form-group">
                  <label>মওকুফের কারণ লিখুন</label>
                  <textarea id="waiverReason" class="form-control" rows="3" required placeholder="যেমন: অসুস্থতা বা জরুরি পারিবারিক কারণ"></textarea>
                </div>
                <button type="submit" class="btn btn-warn">সভাপতির কাছে আবেদন পাঠান</button>
              </form>
            `
            );
            document.getElementById("waiverForm").onsubmit = (e) => {
              e.preventDefault();
              m.fineWaiverRequested = true;
              m.fineWaiverReason = document.getElementById("waiverReason").value.trim();
              saveState();
              closeModal();
              showToast("জরিমানা মওকুফের আবেদন পাঠানো হয়েছে");
              render();
            };
          };
        });

        // President clear fine directly
        document.querySelectorAll("[data-clear-fine]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-clear-fine"));
            const m = state.members.find((x) => x.id === id);
            if (!m) return;
            m.fineDue = 0;
            m.fineWaiverRequested = false;
            m.fineWaiverReason = "";
            saveState();
            showToast(`${m.name}-এর জরিমানা সভাপতি বাতিল করেছেন`);
            render();
          };
        });

        // President add member
        const addMemBtn = document.getElementById("btnAddMember");
        if (addMemBtn) {
          addMemBtn.onclick = () => {
            openModal(
              "নতুন সদস্য যোগ করুন",
              `
              <form id="addMemberForm">
                <div class="form-grid">
                  <div class="form-group">
                    <label>সদস্যের নাম</label>
                    <input type="text" id="mName" class="form-control" required />
                  </div>
                  <div class="form-group">
                    <label>পদবি</label>
                    <input type="text" id="mPos" class="form-control" value="সাধারণ সদস্য" required />
                  </div>
                  <div class="form-group">
                    <label>বই নম্বর</label>
                    <input type="text" id="mBook" class="form-control" required placeholder="যেমন: B-106" />
                  </div>
                  <div class="form-group">
                    <label>ছবি আপলোড (ঐচ্ছিক)</label>
                    <input type="file" id="mPhotoFile" class="form-control" accept="image/*" />
                  </div>
                </div>
                <button type="submit" class="btn btn-primary">সংরক্ষণ করুন</button>
              </form>
            `
            );
            document.getElementById("addMemberForm").onsubmit = (e) => {
              e.preventDefault();
              const name = document.getElementById("mName").value.trim();
              const position = document.getElementById("mPos").value.trim();
              const bookNo = document.getElementById("mBook").value.trim();
              const file = document.getElementById("mPhotoFile").files[0];

              const finishAdd = (photoData) => {
                state.members.push({
                  id: Date.now(),
                  name,
                  position,
                  bookNo,
                  phone: "",
                  paidThisMonth: false,
                  totalDeposited: 0,
                  fineDue: state.deadlinePassed ? state.fineAmount : 0,
                  fineWaiverRequested: false,
                  fineWaiverReason: "",
                  photo: photoData || makeAvatarDataUrl(name, "#0f766e")
                });
                saveState();
                closeModal();
                showToast("নতুন সদস্য যুক্ত হয়েছে");
                render();
              };

              if (file) readFileAsDataUrl(file, finishAdd);
              else finishAdd(null);
            };
          };
        }

        // President edit member
        document.querySelectorAll("[data-edit-member]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-edit-member"));
            const m = state.members.find((x) => x.id === id);
            if (!m) return;

            openModal(
              "সদস্যের তথ্য ও পদবি আপডেট",
              `
              <form id="editMemberForm">
                <div class="form-grid">
                  <div class="form-group">
                    <label>নাম</label>
                    <input type="text" id="emName" class="form-control" value="${m.name}" required />
                  </div>
                  <div class="form-group">
                    <label>পদবি</label>
                    <input type="text" id="emPos" class="form-control" value="${m.position}" required />
                  </div>
                  <div class="form-group">
                    <label>বই নম্বর</label>
                    <input type="text" id="emBook" class="form-control" value="${m.bookNo}" required />
                  </div>
                  <div class="form-group">
                    <label>মোট জমা (টাকা)</label>
                    <input type="number" id="emDep" class="form-control" value="${m.totalDeposited}" required />
                  </div>
                </div>
                <div class="form-group">
                  <label>নতুন ছবি (ঐচ্ছিক)</label>
                  <input type="file" id="emPhoto" class="form-control" accept="image/*" />
                </div>
                <button type="submit" class="btn btn-primary">আপডেট করুন</button>
              </form>
            `
            );

            document.getElementById("editMemberForm").onsubmit = (e) => {
              e.preventDefault();
              m.name = document.getElementById("emName").value.trim();
              m.position = document.getElementById("emPos").value.trim();
              m.bookNo = document.getElementById("emBook").value.trim();
              m.totalDeposited = Number(document.getElementById("emDep").value || 0);
              const file = document.getElementById("emPhoto").files[0];

              const done = () => {
                saveState();
                closeModal();
                showToast("সদস্যের তথ্য আপডেট হয়েছে");
                render();
              };

              if (file) {
                readFileAsDataUrl(file, (url) => {
                  m.photo = url;
                  done();
                });
              } else {
                done();
              }
            };
          };
        });

        // Add income / expense
        const openTxModal = (type) => {
          const isInc = type === "income";
          openModal(
            isInc ? "নতুন আয় যোগ করুন" : "নতুন ব্যয় যোগ করুন",
            `
            <form id="txForm">
              <div class="form-group">
                <label>খাতের নাম</label>
                <input type="text" id="txSource" class="form-control" required placeholder="${isInc ? "যেমন: অনুদান বা বিশেষ আয়" : "যেমন: ত্রাণ, অনুষ্ঠান বা অফিস খরচ"}" />
              </div>
              <div class="form-grid">
                <div class="form-group">
                  <label>পরিমাণ (টাকা)</label>
                  <input type="number" id="txAmount" class="form-control" min="1" required />
                </div>
                <div class="form-group">
                  <label>তারিখ</label>
                  <input type="date" id="txDate" class="form-control" value="${new Date().toISOString().slice(0, 10)}" required />
                </div>
              </div>
              <div class="form-group">
                <label>মন্তব্য / বিবরণ</label>
                <input type="text" id="txNote" class="form-control" />
              </div>
              <button type="submit" class="btn ${isInc ? "btn-success" : "btn-danger"}">
                ${role === "president" ? "সচল হিসেবে যুক্ত করুন" : "অনুমোদনের জন্য পাঠান (অসম্পূর্ণ)"}
              </button>
            </form>
          `
          );

          document.getElementById("txForm").onsubmit = (e) => {
            e.preventDefault();
            state.transactions.unshift({
              id: Date.now(),
              type,
              source: document.getElementById("txSource").value.trim(),
              amount: Number(document.getElementById("txAmount").value || 0),
              date: document.getElementById("txDate").value,
              status: role === "president" ? "active" : "pending",
              note: document.getElementById("txNote").value.trim()
            });
            saveState();
            closeModal();
            showToast(role === "president" ? "হিসাব সচল হিসেবে যুক্ত হয়েছে" : "হিসাব যুক্ত হয়েছে (সভাপতির অনুমোদনের অপেক্ষায়)");
            render();
          };
        };

        const addIncBtn = document.getElementById("btnAddIncome");
        const addExpBtn = document.getElementById("btnAddExpense");
        if (addIncBtn) addIncBtn.onclick = () => openTxModal("income");
        if (addExpBtn) addExpBtn.onclick = () => openTxModal("expense");

        // Cashier edit transaction -> sets status to pending until president approves
        document.querySelectorAll("[data-edit-tx]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-edit-tx"));
            const tx = state.transactions.find((x) => x.id === id);
            if (!tx) return;

            openModal(
              "হিসাব এডিট করুন (সভাপতির অনুমোদন লাগবে)",
              `
              <form id="editTxForm">
                <div class="form-group">
                  <label>খাতের নাম</label>
                  <input type="text" id="etxSource" class="form-control" value="${tx.source}" required />
                </div>
                <div class="form-group">
                  <label>পরিমাণ (টাকা)</label>
                  <input type="number" id="etxAmount" class="form-control" value="${tx.amount}" min="1" required />
                </div>
                <div class="form-group">
                  <label>মন্তব্য</label>
                  <input type="text" id="etxNote" class="form-control" value="${tx.note || ""}" />
                </div>
                <button type="submit" class="btn btn-warn">আপডেট করুন (অসম্পূর্ণ থাকবে)</button>
              </form>
            `
            );

            document.getElementById("editTxForm").onsubmit = (e) => {
              e.preventDefault();
              tx.source = document.getElementById("etxSource").value.trim();
              tx.amount = Number(document.getElementById("etxAmount").value || 0);
              tx.note = document.getElementById("etxNote").value.trim();
              tx.status = "pending";
              saveState();
              closeModal();
              showToast("হিসাব এডিট হয়েছে — সভাপতি ওকে করলে সচল হবে");
              render();
            };
          };
        });

        // President approve or delete transaction
        document.querySelectorAll("[data-approve-tx]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-approve-tx"));
            const tx = state.transactions.find((x) => x.id === id);
            if (!tx) return;
            tx.status = "active";
            saveState();
            showToast("হিসাব সচল করা হয়েছে");
            render();
          };
        });

        document.querySelectorAll("[data-del-tx]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-del-tx"));
            state.transactions = state.transactions.filter((x) => x.id !== id);
            saveState();
            showToast("হিসাব মুছে ফেলা হয়েছে");
            render();
          };
        });

        // Bank Deposit Add & View Receipt
        const addBankBtn = document.getElementById("btnAddBank");
        if (addBankBtn) {
          addBankBtn.onclick = () => {
            openModal(
              "ব্যাংকে টাকা জমা ও রিসিভ আপলোড",
              `
              <form id="bankForm">
                <div class="form-group">
                  <label>ব্যাংকের নাম ও অ্যাকাউন্ট নম্বর</label>
                  <input type="text" id="bName" class="form-control" required placeholder="যেমন: ইসলামী ব্যাংক বাংলাদেশ (হিসাব নং: ...)" />
                </div>
                <div class="form-grid">
                  <div class="form-group">
                    <label>জমার পরিমাণ (টাকা)</label>
                    <input type="number" id="bAmt" class="form-control" min="1" required />
                  </div>
                  <div class="form-group">
                    <label>তারিখ</label>
                    <input type="date" id="bDate" class="form-control" value="${new Date().toISOString().slice(0, 10)}" required />
                  </div>
                </div>
                <div class="form-group">
                  <label>রিসিভ / স্লিপ নোট</label>
                  <input type="text" id="bNote" class="form-control" placeholder="রিসিভ নম্বর বা মন্তব্য" />
                </div>
                <div class="form-group">
                  <label>ব্যাংক রিসিভের ছবি (ঐচ্ছিক)</label>
                  <input type="file" id="bImg" class="form-control" accept="image/*" />
                </div>
                <button type="submit" class="btn btn-primary">ব্যাংক জমা সংরক্ষণ</button>
              </form>
            `
            );

            document.getElementById("bankForm").onsubmit = (e) => {
              e.preventDefault();
              const bankName = document.getElementById("bName").value.trim();
              const amount = Number(document.getElementById("bAmt").value || 0);
              const date = document.getElementById("bDate").value;
              const receiptNote = document.getElementById("bNote").value.trim();
              const file = document.getElementById("bImg").files[0];

              const saveBank = (imgUrl) => {
                state.bankDeposits.unshift({
                  id: Date.now(),
                  bankName,
                  amount,
                  date,
                  receiptNote,
                  receiptImg: imgUrl || makeLogoDataUrl("রিসিভ")
                });
                saveState();
                closeModal();
                showToast("ব্যাংক জমা ও রিসিভ যুক্ত হয়েছে");
                render();
              };

              if (file) readFileAsDataUrl(file, saveBank);
              else saveBank(null);
            };
          };
        }

        document.querySelectorAll("[data-view-receipt]").forEach((btn) => {
          btn.onclick = () => {
            const id = Number(btn.getAttribute("data-view-receipt"));
            const b = state.bankDeposits.find((x) => x.id === id);
            if (!b) return;
            openModal(
              "ব্যাংক জমা রিসিভ",
              `
              <p style="font-size:14px;margin-bottom:8px;"><strong>${b.bankName}</strong></p>
              <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">পরিমাণ: ${formatTk(b.amount)} | তারিখ: ${b.date} | ${b.receiptNote || ""}</p>
              <img src="${b.receiptImg}" alt="ব্যাংক রিসিভ" style="width:100%;max-height:360px;object-fit:contain;border:1px solid var(--border);border-radius:8px;" />
            `
            );
          };
        });
      }

      // Dedicated Positions & Members Directory Tab
      function renderPositionsTab(container, role) {

                role === "president"
                  ? `<button type="button" class="btn btn-primary btn-sm" id="btnQuickAddPos">+ সদস্য / পদবি যোগ করুন</button>`
                  : `<span style="font-size:12px;color:var(--muted);">সকল সদস্য তালিকা দেখতে পাচ্ছেন</span>`
              }
            </div>
            <div class="dir-grid">
              ${state.members
                .map(
                  (m) => `
                <div class="dir-card">
                  <img src="${m.photo}" alt="${m.name}" class="dir-photo" />
                  <div style="font-size:16px;font-weight:700;">${m.name}</div>
                  <span class="badge badge-active" style="margin-top:4px;">${m.position}</span>
                  <div style="font-size:12px;color:var(--muted);margin-top:6px;">বই নং: ${m.bookNo}</div>
                </div>
              `
                )
                .join("")}
            </div>
          </div>
        `;

        const qBtn = document.getElementById("btnQuickAddPos");
        if (qBtn) {
          qBtn.onclick = () => {

      // Messages Tab
      function renderMessagesTab(container, role) {
        const canSend = role === "president" || role === "cashier";
        const senderLabel = role === "president" ? "সভাপতি" : "ক্যাশিয়ার";

        container.innerHTML = `
          <div class="card">
            <div class="card-header">
              <div class="card-title">সংগঠনের মেসেজ ও নোটিশ বোর্ড</div>
            </div>
            ${
              canSend
                ? `<form id="msgForm" style="margin-bottom:16px;">
                    <div class="form-grid">
                      <div class="form-group">
                        <label>প্রেরক</label>
                        <input type="text" class="form-control" readonly value="${senderLabel}" />
                      </div>
                      <div class="form-group">
                        <label>প্রাপক গ্রুপ</label>
                        <select id="msgTarget" class="form-control">
                          <option value="সকল সদস্য">সকল সদস্য</option>
                          <option value="বকেয়া সদস্যবৃন্দ">বকেয়া সদস্যবৃন্দ</option>
                        </select>
                      </div>
                    </div>
                    <div class="form-group">
                      <label>মেসেজ লিখুন</label>
                      <textarea id="msgText" class="form-control" rows="2" required placeholder="সদস্যদের উদ্দেশ্যে বার্তা লিখুন..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">${senderLabel} হিসেবে মেসেজ পাঠান</button>
                  </form>`
                : `<p style="font-size:13px;color:var(--muted);margin-bottom:12px;">সভাপতি ও ক্যাশিয়ারের পাঠানো সকল গুরুত্বপূর্ণ মেসেজ নিচে দেখা যাচ্ছে।</p>`
            }

            <div class="msg-list">
              ${state.messages
                .map(
                  (msg) => `
                <div class="msg-item">
                  <div class="msg-meta">
                    <span class="msg-sender">${msg.senderRole} → ${msg.target}</span>
                    <span>${msg.time}</span>
                  </div>
                  <div style="font-size:14px;">${msg.text}</div>
                </div>
              `
                )
                .join("")}
            </div>
          </div>
        `;

        if (canSend) {
          document.getElementById("msgForm").onsubmit = (e) => {
            e.preventDefault();
            const text = document.getElementById("msgText").value.trim();
            const target = document.getElementById("msgTarget").value;
            if (!text) return;

            state.messages.unshift({
              id: Date.now(),
              senderRole: senderLabel,
              target,
              text,
              time: "এইমাত্র"
            });
            saveState();
            showToast(`${senderLabel} নামে মেসেজ পাঠানো হয়েছে`);
            render();
          };
        }
      }

      // President Approvals & Waiver Tab
      function renderApprovalsTab(container) {
        const pendingTx = state.transactions.filter((t) => t.status !== "active");
        const waiverMembers = state.members.filter((m) => m.fineWaiverRequested);

        container.innerHTML = `
          <div class="card">
            <div class="card-header">
              <div class="card-title">অসম্পূর্ণ আয়-ব্যয় অনুমোদন (সভাপতি)</div>
            </div>
            ${
              pendingTx.length === 0
                ? `<p style="font-size:13px;color:var(--muted);">অনুমোদনের অপেক্ষায় কোনো হিসাব নেই।</p>`
                : pendingTx
                    .map(
                      (t) => `
                  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;border:1px solid var(--border);padding:10px;border-radius:8px;margin-bottom:8px;">
                    <div>
                      <strong>${t.source}</strong> (${t.type === "income" ? "আয়" : "ব্যয়"}) — <strong>${formatTk(t.amount)}</strong>
                      <div style="font-size:12px;color:var(--muted);">${t.note || ""}</div>
                    </div>
                    <div style="display:flex;gap:6px;">
                      <button type="button" class="btn btn-success btn-sm" data-app-id="${t.id}">ওকে / সচল করুন</button>
                      <button type="button" class="btn btn-danger btn-sm" data-rej-id="${t.id}">বাতিল</button>
                    </div>
                  </div>
                `
                    )
                    .join("")
            }
          </div>

          <div class="card">
            <div class="card-header">
              <div class="card-title">জরিমানা মওকুফের আবেদনসমূহ</div>
            </div>
            ${
              waiverMembers.length === 0
                ? `<p style="font-size:13px;color:var(--muted);">কোনো জরিমানা মওকুফের আবেদন নেই।</p>`
                : waiverMembers
                    .map(
                      (m) => `
                  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;border:1px solid var(--border);padding:10px;border-radius:8px;margin-bottom:8px;">
                    <div>
                      <strong>${m.name} (${m.bookNo})</strong> — জরিমানা: ${formatTk(m.fineDue || state.fineAmount)}
                      <div style="font-size:12px;color:var(--muted);">কারণ: ${m.fineWaiverReason || "উল্লেখ নেই"}</div>
                    </div>
                    <div style="display:flex;gap:6px;">
                      <button type="button" class="btn btn-success btn-sm" data-grant-waiver="${m.id}">সম্মতি (জরিমানা বাতিল)</button>
                      <button type="button" class="btn btn-outline btn-sm" data-deny-waiver="${m.id}">অস্বীকৃতি</button>
                    </div>
                  </div>
                `
                    )
                    .join("")
            }
          </div>
        `;

        container.querySelectorAll("[data-app-id]").forEach((b) => {
          b.onclick = () => {
            const tx = state.transactions.find((x) => x.id === Number(b.getAttribute("data-app-id")));
            if (tx) {
              tx.status = "active";
              saveState();
              showToast("হিসাব সচল করা হয়েছে");
              render();
            }
          };
        });

        container.querySelectorAll("[data-rej-id]").forEach((b) => {
          b.onclick = () => {
            state.transactions = state.transactions.filter((x) => x.id !== Number(b.getAttribute("data-rej-id")));
            saveState();
            showToast("অসম্পূর্ণ হিসাব বাতিল করা হয়েছে");
            render();
          };
        });

        container.querySelectorAll("[data-grant-waiver]").forEach((b) => {
          b.onclick = () => {
            const m = state.members.find((x) => x.id === Number(b.getAttribute("data-grant-waiver")));
            if (m) {
              m.fineDue = 0;
              m.fineWaiverRequested = false;
              m.fineWaiverReason = "";
              saveState();
              showToast(`${m.name}-এর জরিমানা মওকুফ করা হয়েছে`);
              render();
            }
          };
        });

        container.querySelectorAll("[data-deny-waiver]").forEach((b) => {
          b.onclick = () => {
            const m = state.members.find((x) => x.id === Number(b.getAttribute("data-deny-waiver")));
            if (m) {
              m.fineWaiverRequested = false;
              saveState();
              showToast("আবেদন প্রত্যাখ্যান করা হয়েছে");
              render();
            }
          };
        });
      }

      // President Settings Tab
      function renderPresidentSettingsTab(container) {
        container.innerHTML = `
          <div class="card">
            <div class="card-header">
              <div class="card-title">সংগঠন ও পিন সেটিংস (সভাপতি)</div>
            </div>
            <form id="presSettingsForm">
              <div class="form-grid">
                <div class="form-group">
                  <label>সংগঠনের নাম</label>
                  <input type="text" id="setOrgName" class="form-control" value="${state.orgName}" required />
                </div>
                <div class="form-group">
                  <label>মাসিক চাঁদা (টাকা)</label>
                  <input type="number" id="setFee" class="form-control" value="${state.monthlyFee}" required />
                </div>
                <div class="form-group">
                  <label>সভাপতি পিন</label>
                  <input type="text" id="setPresPin" class="form-control" value="${state.pins.president}" required />
                </div>

                  <label>ক্যাশিয়ার পিন</label>
                  <input type="text" id="setCashPin" class="form-control" value="${state.pins.cashier}" required />

          </div>

        document.getElementById("presSettingsForm").onsubmit = (e) => {
          e.preventDefault();
          state.orgName = document.getElementById("setOrgName").value.trim();
          state.monthlyFee = Number(document.getElementById("setFee").value || 500);
          state.pins.president = document.getElementById("setPresPin").value.trim() || "1111";
          state.pins.cashier = document.getElementById("setCashPin").value.trim() || "2222";
          saveState();
          showToast("সেটিংস সংরক্ষণ হয়েছে");

        };

      function openOrgSettingsModal() {
        openModal(
          "সংগঠনের লোগো ও তথ্য পরিবর্তন",
          `
          <form id="logoForm">
            <div class="form-group">
              <label>সংগঠনের নাম</label>
              <input type="text" id="modalOrgName" class="form-control" value="${state.orgName}" required />
            </div>
            <div class="form-group">
              <label>স্লোগান / সংক্ষিপ্ত বিবরণ</label>
              <input type="text" id="modalOrgSub" class="form-control" value="${state.orgSlogan}" />
            </div>
            <div class="form-group">
              <label>লোগো ছবি আপলোড</label>
              <input type="file" id="modalLogoFile" class="form-control" accept="image/*" />
            </div>
            <button type="submit" class="btn btn-primary">সংরক্ষণ</button>
          </form>
        `
        );

        document.getElementById("logoForm").onsubmit = (e) => {
          e.preventDefault();
          state.orgName = document.getElementById("modalOrgName").value.trim();
          state.orgSlogan = document.getElementById("modalOrgSub").value.trim();
          const file = document.getElementById("modalLogoFile").files[0];

          const finish = () => {
            saveState();
            closeModal();
            showToast("সংগঠনের লোগো ও নাম আপডেট হয়েছে");
            render();
          };

          if (file) {
            readFileAsDataUrl(file, (url) => {
              state.logoUrl = url;
              finish();
            });
          } else {
            finish();
          }
        };
      }

      // A4 Statement Download / Print with Photos & Names

        const totals = computeTotals();
        const sheet = document.getElementById("a4StatementSheet");

        sheet.innerHTML = `
          <div style="font-family:'Hind Siliguri',sans-serif;color:#0f172a;padding:8px;">
            <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #0f766e;padding-bottom:12px;margin-bottom:16px;">
              <div style="display:flex;align-items:center;gap:12px;">
                <img src="${state.logoUrl}" alt="লোগো" style="width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid #cbd5e1;" />
                <div>

            </div>

                <div style="font-size:16px;font-weight:700;color:#16a34a;">${formatTk(totals.activeIncome)}</div>
              </div>
              <div style="border:1px solid #cbd5e1;padding:10px;border-radius:8px;">
                <div style="font-size:11px;color:#475569;">অনুমোদিত মোট ব্যয়</div>
                <div style="font-size:16px;font-weight:700;color:#dc2626;">${formatTk(totals.activeExpense)}</div>
              </div>
              <div style="border:1px solid #cbd5e1;padding:10px;border-radius:8px;">
                <div style="font-size:11px;color:#475569;">নিট তহবিল</div>
                <div style="font-size:16px;font-weight:700;color:#0f766e;">${formatTk(totals.netFund)}</div>
              </div>
              <div style="border:1px solid #cbd5e1;padding:10px;border-radius:8px;">
                <div style="font-size:11px;color:#475569;">মোট ব্যাংক জমা</div>
                <div style="font-size:16px;font-weight:700;color:#2563eb;">${formatTk(totals.totalBank)}</div>
              </div>
            </div>

            <h3 style="font-size:15px;margin-bottom:8px;">সকল সদস্যের টোটাল হিসাব তালিকা</h3>
            <table style="width:100%;border-collapse:collapse;font-size:13px;">
              <thead>
                <tr style="background:#f1f5f9;">
                  <th style="border:1px solid #cbd5e1;padding:8px;text-align:left;">ছবি ও নাম</th>
                  <th style="border:1px solid #cbd5e1;padding:8px;text-align:left;">পদবি</th>
                  <th style="border:1px solid #cbd5e1;padding:8px;text-align:left;">বই নং</th>
                  <th style="border:1px solid #cbd5e1;padding:8px;text-align:right;">মোট জমা</th>
                  <th style="border:1px solid #cbd5e1;padding:8px;text-align:center;">স্ট্যাটাস</th>
                  <th style="border:1px solid #cbd5e1;padding:8px;text-align:right;">জরিমানা</th>
                </tr>
              </thead>
              <tbody>
                ${state.members
                  .map((m) => {
                    const fine = !m.paidThisMonth && state.deadlinePassed ? Number(m.fineDue || state.fineAmount) : 0;
                    return `
                      <tr>
                        <td style="border:1px solid #cbd5e1;padding:6px 8px;">
                          <div style="display:flex;align-items:center;gap:8px;">
                            <img src="${m.photo}" alt="${m.name}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid #cbd5e1;" />

                        <td style="border:1px solid #cbd5e1;padding:6px 8px;text-align:right;">${formatTk(fine)}</td>
                      </tr>
                    `;
                  })
                  .join("")}
              </tbody>
            </table>
          </div>
        `;

        window.print();
      }

      function render() {
        const route = getRoute();
        renderHeader(route);

        const root = document.getElementById("appRoot");
        if (route === "main") {
          renderMainPortal(root);
        } else if (route === "president") {
          if (!unlockedRoles.president) renderPinLogin(root, "president");
          else renderRoleWorkspace(root, "president");
        } else if (route === "cashier") {
          if (!unlockedRoles.cashier) renderPinLogin(root, "cashier");
          else renderRoleWorkspace(root, "cashier");
        } else if (route === "member") {
          renderRoleWorkspace(root, "member");
        }
      }

      let currentLockedRole = getRoute();

      window.addEventListener("hashchange", () => {
        const nextRoute = getRoute();
        if (currentLockedRole !== "main" && nextRoute === "main") {
          window.location.hash = "#" + currentLockedRole;
          showToast("এই পেজ থেকে মেইন পেজে যাওয়ার অনুমতি নেই");
          return;
        }
        currentLockedRole = nextRoute;
        activeTab = "overview";
        render();
      });

      render();
    })();
  </script>
